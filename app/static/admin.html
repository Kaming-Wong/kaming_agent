<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工客服后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .sidebar-header {
            padding: 18px 20px;
            background: #1a73e8;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .sidebar-header .nav-links {
            font-weight: normal;
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        .sidebar-header .nav-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .sidebar-header .nav-links a:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .session-card {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 8px;
            border: 1px solid #e8e8e8;
            transition: all 0.2s;
        }
        .session-card:hover { border-color: #1a73e8; background: #f8faff; }
        .session-card.active { border-color: #1a73e8; background: #e8f0fe; }
        .session-card .session-id { font-size: 12px; color: #666; }
        .session-card .preview { font-size: 13px; margin-top: 4px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-card .count { font-size: 11px; color: #999; margin-top: 4px; }
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-header {
            padding: 18px 24px;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            font-size: 15px;
            font-weight: 600;
        }
        .main-header .hint { font-weight: normal; font-size: 12px; color: #999; margin-left: 12px; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .msg.user { background: #1a73e8; color: #fff; align-self: flex-end; }
        .msg.ai { background: #f0f2f5; color: #1a1a1a; align-self: flex-start; }
        .msg .role-tag { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
        .reply-area {
            padding: 16px 24px;
            border-top: 1px solid #e8e8e8;
            background: #fff;
            display: flex;
            gap: 10px;
        }
        .reply-area textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            height: 60px;
            outline: none;
        }
        .reply-area textarea:focus { border-color: #1a73e8; }
        .reply-area button {
            padding: 0 24px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            height: 60px;
        }
        .reply-area button:hover { background: #1557b0; }
        .reply-area button:disabled { background: #ccc; cursor: not-allowed; }
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }
        .badge { background: #e53935; color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 8px; }
        .refresh-btn {
            background: none; border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 4px 12px; border-radius: 14px; cursor: pointer;
            font-size: 12px; float: right;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        待处理会话
        <button class="refresh-btn" onclick="loadSessions()">🔄 刷新</button>
        <div class="nav-links">
            <a href="/static/chat.html">💬聊天</a>
            <a href="/static/knowledge.html">📚知识库</a>
        </div>
    </div>
    <div class="sidebar-list" id="sessionList">
        <div class="empty-state" style="padding:40px 0">暂无待处理会话</div>
    </div>
</div>
<div class="main-panel">
    <div class="main-header" id="mainHeader">
        选择一个会话 <span class="hint">点击左侧列表查看详情并回复</span>
    </div>
    <div class="messages-area" id="messagesArea">
        <div class="empty-state">← 请从左侧选择一个待处理的会话</div>
    </div>
    <div class="reply-area" id="replyArea" style="display:none">
        <textarea id="replyInput" placeholder="输入人工回复..." maxlength="2000"></textarea>
        <button id="replyBtn" onclick="sendReply()">发送回复</button>
    </div>
</div>

<script>
    let currentSessionId = '';
    let sessions = [];

    async function loadSessions() {
        try {
            const res = await fetch('/api/v1/admin/pending');
            const json = await res.json();
            if (json.status === 200) {
                sessions = json.data.sessions || [];
                renderSessionList();
            }
        } catch (e) {
            console.error('Failed to load sessions:', e);
        }
    }

    function renderSessionList() {
        const list = document.getElementById('sessionList');
        if (sessions.length === 0) {
            list.innerHTML = '<div class="empty-state" style="padding:40px 0">暂无待处理会话</div>';
            return;
        }
        list.innerHTML = sessions.map(s => `
            <div class="session-card ${s.session_id === currentSessionId ? 'active' : ''}"
                 onclick="selectSession('${s.session_id}')">
                <div class="session-id">${s.session_id}</div>
                <div class="preview">${s.last_message || '(空)'}</div>
                <div class="count">${s.message_count} 条消息</div>
            </div>
        `).join('');
    }

    async function selectSession(sessionId) {
        currentSessionId = sessionId;
        renderSessionList();

        document.getElementById('mainHeader').textContent = '会话: ' + sessionId;
        document.getElementById('replyArea').style.display = 'flex';
        document.getElementById('replyInput').value = '';

        const area = document.getElementById('messagesArea');
        area.innerHTML = '<div class="empty-state">加载中...</div>';

        try {
            const res = await fetch(`/api/v1/chat/${sessionId}/history?limit=100`);
            const json = await res.json();
            if (json.status === 200) {
                area.innerHTML = '';
                for (const msg of json.data.messages) {
                    const div = document.createElement('div');
                    div.className = `msg ${msg.role}`;
                    const tag = msg.role === 'user' ? '用户' : msg.role === 'ai' ? 'AI' : '人工';
                    let html = `<div class="role-tag">${tag}</div>${escapeHtml(msg.content)}`;
                    // 引用信息
                    if (msg.references && msg.references.length > 0) {
                        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e8e8e8;font-size:11px;color:#666">';
                        for (const ref of msg.references) {
                            html += `<div style="margin-bottom:4px">📖 ${escapeHtml(ref.source)} 片段${ref.chunk_index} ${ref.minio_url ? `<a href="${escapeHtml(ref.minio_url)}" target="_blank" style="color:#1a73e8">🔗查看原文</a>` : ''}</div>`;
                        }
                        html += '</div>';
                    }
                    div.innerHTML = html;
                    area.appendChild(div);
                }
                area.scrollTop = area.scrollHeight;
            }
        } catch (e) {
            area.innerHTML = '<div class="empty-state">加载失败</div>';
        }
    }

    async function sendReply() {
        const input = document.getElementById('replyInput');
        const message = input.value.trim();
        if (!message || !currentSessionId) return;

        const btn = document.getElementById('replyBtn');
        btn.disabled = true;
        btn.textContent = '发送中...';

        try {
            const res = await fetch('/api/v1/chat/resume', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ session_id: currentSessionId, message }),
            });
            const json = await res.json();
            if (json.status === 200) {
                input.value = '';
                // 重新加载消息历史
                await selectSession(currentSessionId);
                loadSessions();
            } else {
                alert('回复失败: ' + (json.message || '未知错误'));
            }
        } catch (e) {
            alert('网络错误');
        } finally {
            btn.disabled = false;
            btn.textContent = '发送回复';
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Auto refresh every 15 seconds
    loadSessions();
    setInterval(loadSessions, 15000);
</script>
</body>
</html>
