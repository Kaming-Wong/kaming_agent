<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 480px;
            height: 700px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #1a73e8;
            color: #fff;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .status-dot {
            width: 8px; height: 8px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background: #1a73e8;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            background: #f0f2f5;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.human {
            background: #fff3e0;
            color: #e65100;
            align-self: flex-start;
            border-left: 3px solid #ff9800;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            background: #e8f5e9;
            color: #2e7d32;
            align-self: center;
            text-align: center;
            font-size: 12px;
            padding: 6px 16px;
        }
        .message .intent-tag {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .ref-card {
            background: #f0f7ff;
            border: 1px solid #d0e3f7;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.4;
        }
        .ref-card .ref-title { font-weight: 500; color: #1a73e8; }
        .ref-card .ref-meta { color: #666; margin-top: 2px; }
        .ref-card .ref-link {
            display: inline-block;
            margin-top: 4px;
            color: #1a73e8;
            text-decoration: none;
            font-size: 11px;
        }
        .ref-card .ref-link:hover { text-decoration: underline; }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            align-self: flex-start;
            background: #f0f2f5;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator span {
            width: 8px; height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus { border-color: #1a73e8; }
        .chat-input-area input:disabled { background: #f5f5f5; }
        .chat-input-area button {
            width: 40px; height: 40px;
            border: none;
            border-radius: 50%;
            background: #1a73e8;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .chat-input-area button:hover { background: #1557b0; }
        .chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .human-notice {
            padding: 12px 20px;
            background: #fff3e0;
            border-top: 1px solid #ffe0b2;
            font-size: 13px;
            color: #e65100;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .human-notice.show { display: flex; }
        .human-notice .spinner {
            width: 14px; height: 14px;
            border: 2px solid #ffe0b2;
            border-top-color: #e65100;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .clear-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            margin-left: auto;
        }
        .clear-btn:hover { color: #666; border-color: #bbb; }
        .nav-links {
            display: flex;
            gap: 4px;
            margin-left: 12px;
            font-weight: normal;
            font-size: 12px;
        }
        .nav-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-links a:hover { background: rgba(255,255,255,0.15); color: #fff; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <span class="status-dot"></span>
        <span>智能客服</span>
        <div class="nav-links">
            <a href="/static/knowledge.html">📚知识库</a>
            <a href="/static/admin.html">👤后台</a>
        </div>
        <button class="clear-btn" onclick="clearHistory()">清除对话</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai">您好！我是智能客服助手，有什么可以帮您的吗？</div>
    </div>
    <div class="human-notice" id="humanNotice">
        <span class="spinner"></span>
        <span>已转接人工客服，请稍候...</span>
    </div>
    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="输入您的问题..." maxlength="2000"
               onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    let sessionId = localStorage.getItem('chat_session_id') || '';
    let isWaiting = false;

    function addMessage(role, content, intent, references) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        if (intent && role === 'ai') {
            const tag = document.createElement('div');
            tag.className = 'intent-tag';
            const labels = {'general_chat': '日常问答', 'legal_assist': '法律咨询', 'human_handoff': '转人工'};
            tag.textContent = labels[intent] || intent;
            div.appendChild(tag);
        }
        container.appendChild(div);

        // 引用卡片
        if (references && references.length > 0) {
            for (const ref of references) {
                const card = document.createElement('div');
                card.className = 'ref-card';
                card.innerHTML = `
                    <div class="ref-title">📖 ${escapeHtml(ref.source || '未知来源')}</div>
                    <div class="ref-meta">片段 ${ref.chunk_index} · ${escapeHtml(ref.relevance || '')}</div>
                    ${ref.minio_url ? `<a class="ref-link" href="${escapeHtml(ref.minio_url)}" target="_blank">🔗 查看原文</a>` : ''}
                `;
                container.appendChild(card);
            }
        }

        container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'typing-indicator';
        div.id = 'typingIndicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function setWaiting(waiting) {
        isWaiting = waiting;
        document.getElementById('messageInput').disabled = waiting;
        document.getElementById('sendBtn').disabled = waiting;
        document.getElementById('humanNotice').className = waiting ? 'human-notice show' : 'human-notice';
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || isWaiting) return;
        input.value = '';

        addMessage('user', message);

        if (!sessionId) {
            sessionId = 'session_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            localStorage.setItem('chat_session_id', sessionId);
        }

        showTyping();

        try {
            const res = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message, session_id: sessionId }),
            });
            const json = await res.json();
            hideTyping();

            if (json.status === 200) {
                const data = json.data;
                if (data.interrupted || json.message === 'human_handoff') {
                    setWaiting(true);
                    addMessage('system', '⏳ 已转接人工客服，请稍候...');
                    startPolling();
                } else {
                    addMessage('ai', data.response, data.intent, data.references);
                    sessionId = data.session_id;
                    localStorage.setItem('chat_session_id', sessionId);
                }
            } else {
                addMessage('ai', '抱歉，服务异常，请稍后再试。');
            }
        } catch (err) {
            hideTyping();
            addMessage('ai', '网络错误，请检查连接后重试。');
        }
    }

    async function loadHistory() {
        if (!sessionId) return;
        try {
            const res = await fetch(`/api/v1/chat/${sessionId}/history`);
            const json = await res.json();
            if (json.status === 200) {
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                addMessage('ai', '您好！我是智能客服助手，有什么可以帮您的吗？');
                for (const msg of json.data.messages) {
                    if (msg.role === 'user') addMessage('user', msg.content);
                    else if (msg.role === 'ai') addMessage('ai', msg.content, msg.intent, msg.references);
                    else if (msg.role === 'human') addMessage('human', '👤 人工客服: ' + msg.content, '', msg.references);
                }
            }
        } catch (e) {
            console.log('History load skipped');
        }
    }

    function startPolling() {
        let retries = 0;
        const maxRetries = 120;
        const interval = setInterval(async () => {
            retries++;
            if (retries > maxRetries) {
                clearInterval(interval);
                setWaiting(false);
                addMessage('system', '⏰ 人工客服响应超时，请重新发送消息。');
                return;
            }
            try {
                const res = await fetch(`/api/v1/chat/${sessionId}/history?limit=3`);
                const json = await res.json();
                if (json.status === 200) {
                    const msgs = json.data.messages;
                    if (msgs.length > 0) {
                        const last = msgs[msgs.length - 1];
                        if (last.role === 'human' || last.role === 'ai' && last.intent === 'human_handoff') {
                            clearInterval(interval);
                            setWaiting(false);
                            addMessage('human', '👤 人工客服: ' + last.content);
                            addMessage('system', '✅ 人工服务已完成，您可以继续提问。');
                        }
                    }
                }
            } catch (e) {
                console.log('Polling error:', e);
            }
        }, 2000);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function clearHistory() {
        if (sessionId) {
            fetch(`/api/v1/chat/${sessionId}/history`, {method: 'GET'});
        }
        sessionId = 'session_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        localStorage.setItem('chat_session_id', sessionId);
        document.getElementById('chatMessages').innerHTML = '';
        addMessage('ai', '您好！我是智能客服助手，有什么可以帮您的吗？');
        setWaiting(false);
    }

    // Load history on page load
    if (sessionId) loadHistory();
</script>
</body>
</html>
